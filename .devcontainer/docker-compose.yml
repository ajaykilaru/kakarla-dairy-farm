services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-20-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    working_dir: /workspaces/${localWorkspaceFolderBasename}
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: codespaces-development-secret-change-before-production-2026
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: codespaces-local-mysql-password
      DB_NAME: smart_dairy
      DB_SSL: "false"

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: codespaces-local-mysql-password
      MYSQL_DATABASE: smart_dairy
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcodespaces-local-mysql-password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
